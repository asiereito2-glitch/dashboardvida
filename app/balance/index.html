function openPinCapture(title, onDone){
  let entered = '';
  const body = `
    <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100%;padding-bottom:40px;">
      <div class="lock-dots" id="capDots"></div>
      <div class="lock-pad" id="capPad"></div>
    </div>`;
  openModal(title, body);
  const renderDots = ()=>{
    $('#capDots').innerHTML = [0,1,2,3].map(i=>`<div class="lock-dot ${i<entered.length?'filled':''}"></div>`).join('');
  };
  const renderPad = ()=>{
    const keys = ['1','2','3','4','5','6','7','8','9','','0','⌫'];
    $('#capPad').innerHTML = keys.map(k=> k==='' ? '<div></div>' : `<button class="lock-key" data-k="${k}">${k}</button>`).join('');
    $$('#capPad [data-k]').forEach(b=>{
      bindPinKey(b, ()=>{
        const k = b.dataset.k;
        if (k==='⌫'){ entered = entered.slice(0,-1); }
        else if (entered.length<4){ entered += k; }
        renderDots();
        if (entered.length===4){
          afterRelease(()=>{ closeModal(); onDone(entered); });
        }
      });
    });
  };
  renderDots(); renderPad();
}

/* ---- backup / reset ---- */
async function exportBackup(){
  const data = {
    exportedAt: new Date().toISOString(),
    profile: state.profile,
    categories: state.categories,
    transactions: state.transactions,
    recurring: state.recurring,
    accounts: state.accounts,
    trips: state.trips,
  };
  const json = JSON.stringify(data, null, 2);
  const filename = `balance-backup-${todayIso()}.json`;
  if (_downloads){
    try{
      await _downloads.save({filename, data: json});
      toast('Copia de seguridad guardada');
      return;
    }catch(e){}
  }
  const blob = new Blob([json], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
  toast('Copia de seguridad descargada');
}
function pickImportFile(){
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = '.json,application/json';
  inp.onchange = async ()=>{
    const f = inp.files && inp.files[0]; if (!f) return;
    let data;
    try{ data = JSON.parse(await f.text()); }catch(e){ toast('El archivo no es válido'); return; }
    if (!data || !Array.isArray(data.transactions) || !Array.isArray(data.categories)){ toast('No parece una copia de Balance'); return; }
    const n = k => Array.isArray(data[k]) ? data[k].length : 0;
    const body = `
      <div class="empty-state" style="text-align:left; padding:20px 22px;">
        Se reemplazarán tus datos actuales por los de la copia:<br>
        ${n('transactions')} movimientos · ${n('categories')} categorías · ${n('recurring')} recurrentes${Array.isArray(data.accounts)?` · ${n('accounts')} cuentas`:''}.<br><br>
        Tu PIN actual se mantiene. Esta acción no se puede deshacer.
      </div>
      <div class="field" style="margin-top:6px;">
        <button class="btn" id="doImport">Importar datos</button>
      </div>`;
    openModal('Importar copia', body);
    $('#doImport').onclick = async ()=>{
      $('#doImport').disabled = true; $('#doImport').textContent = 'Importando…';
      try{ await importBackup(data); closeModal(); toast('Datos importados'); }
      catch(e){ toast('Error al importar'); $('#doImport').disabled = false; $('#doImport').textContent = 'Importar datos'; }
      renderAll();
    };
  };
  inp.click();
}
async function importBackup(data){
  const cols = ['categories','transactions','recurring'];
  if (Array.isArray(data.accounts)) cols.push('accounts'); // copias antiguas no incluían cuentas
  if (Array.isArray(data.trips)) cols.push('trips');
  const prof = Object.assign({}, data.profile||{});
  delete prof.pinEnabled; delete prof.pinHash; delete prof.createdAt;
  if (state.cloud){
    for (const c of cols){
      const col = _profileRef.collection(c);
      await Promise.all(state[c].map(d=>col.doc(d.id).delete()));
      await Promise.all(data[c].map(({id, ...rest})=>id ? col.doc(id).set(rest) : col.add(rest)));
    }
    if (Object.keys(prof).length) await saveProfile(prof);
  } else {
    for (const c of cols) state[c] = data[c].map(d=>({...d, id: d.id || uid()}));
    Object.assign(state.profile, prof);
    sortTx(); localSave();
  }
  applyTheme(state.profile.theme);
}

async function moveCategory(catId, direction, type){
  const list = state.categories.filter(c=>c.type===type).slice().sort((a,b)=>(a.order||0)-(b.order||0));
  const idx = list.findIndex(c=>c.id===catId);
  const swapIdx = direction==='up' ? idx-1 : idx+1;
  if (idx<0 || swapIdx<0 || swapIdx>=list.length) return;
  const a = list[idx], b = list[swapIdx];
  const aOrder = a.order||0, bOrder = b.order||0;
  await updateCategory(a.id, {order: bOrder});
  await updateCategory(b.id, {order: aOrder});
}

function openRecurringManager(){
  const rowHtml = r=>{
    const c = r.type==='transfer' ? {name:'Inversión', icon:'invest', color:MONEY_INVEST_COLOR} : catById(r.categoryId);

      <div class="row-flex"><span class="row-val tabular">${r.type==='income'?'+ ':'− '}${fmtMoney(r.amount)}</span>${chevSvg()}</div>
    </button>`;
  };
  // agrupados por tipo, cada bloque con lo que supone al mes (semanal ×52/12, anual ÷12…)
  const PER_MONTH = {daily:365/12, weekly:52/12, monthly:1, yearly:1/12};
  const rowsHtml = [['income','INGRESOS'],['expense','GASTOS'],['transfer','INVERSIÓN']].map(([t,label])=>{
    const list = state.recurring.filter(r=>r.type===t).sort((a,b)=>a.nextDate.localeCompare(b.nextDate));
    if (!list.length) return '';
    const month = list.reduce((x,r)=>x + r.amount*(PER_MONTH[r.frequency]||1), 0);
    const approx = list.some(r=>r.frequency!=='monthly') ? '≈ ' : '';
    return `<div class="section-row" style="padding-top:8px;"><div class="section-title">${label}</div><div class="tabular" style="font-size:12.5px; color:var(--gray-500);">${approx}${fmtMoney(month)}/mes</div></div>` + list.map(rowHtml).join('');
  }).join('');
  const body = `
    <div class="empty-state" style="text-align:left; padding:16px 22px;">Cada vez que abras la app, los pagos pendientes se añaden automáticamente a tus movimientos.</div>
    ${rowsHtml || '<div class="empty-state">Sin recurrentes todavía.</div>'}

function openRecurringEditor(recId, fromManager){
  const editing = recId ? state.recurring.find(r=>r.id===recId) : null;
  let selType = editing ? editing.type : 'expense';
  let selCat = editing ? editing.categoryId : (orderedCategories(selType)[0]||{}).id;
  let selAcc = editing ? (editing.type==='transfer' ? editing.fromAccountId : editing.accountId)||null : (state.profile.defaultAccountId||null); // inversión: cuenta de la que sale
  let selFreq = editing ? editing.frequency : 'monthly';

   HOJA: AÑADIR / EDITAR MOVIMIENTO (con calculadora integrada)
   ====================================================================== */
let addState = null;
function openAddSheet(editTx, duplicate){
  const src = editTx || null;
  const editing = duplicate ? null : src;
  addState = {
    type: editing ? editing.type : 'expense',
    amount: editing ? String(editing.amount).replace('.',',') : '',
    categoryId: editing ? editing.categoryId : null,
    accountId: editing ? (editing.accountId||null) : (state.profile.homeAccountFilter||state.profile.defaultAccountId||null),
    fromAccountId: editing ? (editing.fromAccountId||null) : (state.profile.homeAccountFilter||state.profile.defaultAccountId||null),
    toAccountId: editing ? (editing.toAccountId||null) : null,
    note: editing ? (editing.note||'') : '',
    date: editing ? editing.date : todayIso(),
    repeat: '',
    extraordinary: !!(src && src.extraordinary), // al duplicar, la copia también lo es
    recur: false, recurFreq: 'monthly', recurStart: 'now',
    tripId: src ? (src.tripId||null) : ((tripForDate(todayIso())||{}).id||null), // dentro de un viaje se elige solo
  };
  if (duplicate && src){
    Object.assign(addState, {type:src.type, amount:String(src.amount).replace('.',','), categoryId:src.categoryId||null,
      accountId:src.accountId||null, fromAccountId:src.fromAccountId||null, toAccountId:src.toAccountId||null, note:src.note||''});
  }
  if ((addState.type==='expense'||addState.type==='income') && !addState.categoryId){
    const first = orderedCategories(addState.type)[0];
    addState.categoryId = first ? first.id : null;
  }
  if (addState.type==='transfer' && !addState.toAccountId){
    const firstInv = state.accounts.find(a=>a.type==='inversion');
    addState.toAccountId = firstInv ? firstInv.id : null;
  }
  renderAddSheet(editing);
  $('#scrim').classList.add('show');
  $('#addSheet').classList.add('show');
}
function closeAddSheet(){
  $('#scrim').classList.remove('show');
  $('#addSheet').classList.remove('show');
  if (state.returnTo){ const f = state.returnTo, y = state.detailScroll||0; state.returnTo = null; state.detailScroll = 0;
    setTimeout(()=>{ f(); const b = $('#pickerSheet .sheet-body'); if (b) b.scrollTop = y; }, 250); } // vuelve a la misma zona
}
function orderedCategories(type){
  return state.categories.filter(c=>c.type===type).slice().sort((a,b)=>(a.order||0)-(b.order||0));
}
// siguiente fecha a partir de un movimiento, saltando las que ya han pasado (no rellena hacia atrás)
function recurNextFrom(date, f){
  const day = +date.slice(8);
  let d = advanceDate(date, f, day);
  while (d <= todayIso()) d = advanceDate(d, f, day);
  return d;
}

    const amount = parseFloat(String(addState.amount).replace(',','.'));
    if (!amount || amount<=0){ toast('Introduce un importe'); return; }
    // iOS ignora el max del input de fecha: sin esto un movimiento futuro se descontaría ya del saldo
    if (!(isInvest && addState.repeat && !editing) && addState.date > todayIso()){ toast('La fecha no puede ser futura'); return; }
    if (isInvest || isMove){
      if (!addState.fromAccountId || !addState.toAccountId){ toast('Elige las dos cuentas'); return; }
      if (addState.fromAccountId===addState.toAccountId){ toast('Elige dos cuentas distintas'); return; }
      const payload = {type:addState.type, amount, fromAccountId:addState.fromAccountId, toAccountId:addState.toAccountId, note:addState.note, date:addState.date, categoryId:null, accountId:null};
      if (editing && editing.extraordinary) payload.extraordinary = false;
      if (editing && editing.tripId) payload.tripId = null;
      if (!editing && isInvest && addState.repeat){
        // recurrente: el dinero solo se mueve cuando llega cada fecha; si la primera es hoy o pasada, se ejecuta ya
        const due = addState.date <= todayIso();
        const rid = await addRecurring({name:addState.note, amount, type:'transfer', categoryId:null, fromAccountId:addState.fromAccountId, toAccountId:addState.toAccountId, frequency:addState.repeat, day:+addState.date.slice(8), nextDate: due ? advanceDate(addState.date, addState.repeat) : addState.date});
        if (due){
          await addTransaction({...payload, id:`rec_${rid}_${addState.date}`});
        }
      } else if (editing) await updateTransaction(editing.id, payload);
      else await addTransaction(payload);
    } else {
      if (!addState.categoryId){ toast('Elige una categoría'); return; }
      const payload = {type:addState.type, amount, categoryId:addState.categoryId, accountId:addState.accountId, note:addState.note, date:addState.date, fromAccountId:null, toAccountId:null};
      if (addState.extraordinary && !addState.tripId) payload.extraordinary = true; else if (editing && editing.extraordinary) payload.extraordinary = false;
      if (addState.tripId) payload.tripId = addState.tripId; else if (editing && editing.tripId) payload.tripId = null;
      if (!editing && addState.recur){
        // recurrente: "empieza este mes" apunta ya el movimiento; "el siguiente" solo lo programa
        const f = addState.recurFreq;
        const rid = await addRecurring({name:addState.note, amount, type:addState.type, categoryId:addState.categoryId, accountId:addState.accountId, frequency:f, day:+addState.date.slice(8), nextDate: advanceDate(addState.date, f)});
        if (addState.recurStart==='now') await addTransaction({...payload, id:`rec_${rid}_${addState.date}`});
      } else if (editing){
        if (addState.recur) payload.recurringId = await addRecurring({name:addState.note, amount, type:addState.type, categoryId:addState.categoryId, accountId:addState.accountId, frequency:addState.recurFreq, day:+addState.date.slice(8), nextDate: recurNextFrom(addState.date, addState.recurFreq)});
        await updateTransaction(editing.id, payload);
      } else await addTransaction(payload);
    }
    closeAddSheet();
    toast(editing ? 'Movimiento actualizado' : (!isInvest && !isMove && addState.recur && addState.recurStart==='next') ? 'Recurrente programado' : 'Movimiento añadido');
  };
  if (editing){
    $('#addDupBtn').onclick = ()=>openAddSheet(editing, true);
    $('#addDeleteBtn').onclick = async ()=>{
      await deleteTransaction(editing.id);
      closeAddSheet();
      toast('Movimiento eliminado');
    };
    confirmTap($('#addDeleteBtn'), $('#addDeleteBtn').onclick); // pide confirmación
  }
}

/* ======================================================================
   PAGOS DESDE ATAJOS (Apple Pay)
   La automatización "Transacción" de Atajos abre la app con
   ?importe=12,50&comercio=MERCADONA&tarjeta=Visa&t=<fecha y hora>
   y aquí se abre el formulario ya relleno para confirmarlo.
   ====================================================================== */
const PAY_DONE_KEY = 'balance_pay_done_v1';
// palabras del comercio → nombre de categoría (solo si nunca has apuntado ese comercio)
const PAY_KEYWORDS = [
  ['Comida', ['mercadona','carrefour','lidl','aldi','dia ','eroski','alcampo','consum','hipercor','supermercado','super ','bonpreu','caprabo','ahorramas','bm ','gadis','froiz','restaurante','bar ','cafe','cafeteria','burger','mcdonald','kfc','telepizza','domino','glovo','just eat','uber eats','panaderia','starbucks']],
  ['Transporte', ['repsol','cepsa','bp ','galp','shell','petronor','gasolinera','renfe','metro','emt','tmb','bus','uber','cabify','bolt','free now','parking','aparcamiento','peaje','autopista','taxi']],
  ['Compras', ['amazon','zara','primark','corte ingles','decathlon','ikea','mediamarkt','fnac','pull','bershka','mango','leroy','aliexpress','shein','h&m']],
  ['Ocio', ['netflix','spotify','hbo','disney','prime video','cine','cines','steam','playstation','nintendo','xbox','ticketmaster','entradas']],
  ['Salud', ['farmacia','clinica','dentista','hospital','optica']],
  ['Facturas', ['iberdrola','endesa','naturgy','repsol luz','movistar','vodafone','orange','digi','masmovil','yoigo','jazztel','agua']],
  ['Viajes', ['ryanair','vueling','iberia','booking','airbnb','hotel','easyjet']],
];
function parsePayAmount(raw){
  let s = String(raw||'').replace(/[^\d.,-]/g,'');
  if (!s) return 0;
  const lc = s.lastIndexOf(','), ld = s.lastIndexOf('.');
  if (lc>-1 && ld>-1) s = lc>ld ? s.replace(/\./g,'').replace(',','.') : s.replace(/,/g,''); // 1.234,56 o 1,234.56
  else if (lc>-1) s = s.replace(',','.');
  return Math.abs(parseFloat(s)) || 0;
}
// "MERCADONA S.A. 1234 MADRID" → "Mercadona Madrid"
function cleanMerchant(raw){
  let s = String(raw||'').replace(/\s+/g,' ').trim();
  s = s.replace(/\b(S\.?A\.?U?|S\.?L\.?U?)\b\.?/gi,'').replace(/[*#]+/g,' ').replace(/\b\d{3,}\b/g,'').replace(/\s+/g,' ').trim();
  if (s && s===s.toUpperCase()) s = s.toLowerCase().replace(/(^|\s)\S/g, c=>c.toUpperCase());
  return s.slice(0,60);
}
// "importe=12,50&comercio=Mercadona&tarjeta=Visa&t=…" (lo que copia el atajo)
function parsePaymentText(str){
  const out = {};
  // el atajo no codifica el texto: un "+" o un "%" del comercio se dejan tal cual
  try{ String(str||'').trim().replace(/^[?#]/,'').split('&').forEach(part=>{ const i = part.indexOf('='); if (i>0) out[part.slice(0,i).trim().toLowerCase()] = part.slice(i+1).trim(); }); }catch(e){}
  const raw = out.importe ?? out.amount;
  if (raw==null) return null;
  const amount = parsePayAmount(raw);
  if (!amount) return null;
  return {amount, merchant: out.comercio || out.merchant || '', card: out.tarjeta || out.card || '', key: [raw, out.comercio||out.merchant||'', out.t||out.fecha||todayIso()].join('|')};
}
function readPaymentParams(){
  const dec = s=>{ try{ return decodeURIComponent(s.replace(/\+/g,' ')); }catch(e){ return s; } };
  try{ return parsePaymentText(dec(location.search)) || parsePaymentText(dec(location.hash)); }catch(e){ return null; }
}
// botón de Inicio: lee el pago que el atajo dejó en el portapapeles
async function pastePayment(){
  const useText = text=>{
    const p = parsePaymentText(text);
    if (!p) return false;
    if (payAlreadyDone(p.key)){ toast('Ese pago ya lo has apuntado'); return true; }
    _pendingPay = p; openPendingPayment(); return true;
  };
  try{ if (navigator.clipboard && navigator.clipboard.readText && useText(await navigator.clipboard.readText())) return; }catch(e){}
  // sin permiso para leer el portapapeles: se pega a mano en el cuadro
  openPickerSheet('Pegar pago', `<div class="field" style="padding-top:14px;">
      <label>Mantén pulsado y elige Pegar</label>
      <input id="payPasteInput" type="text" autocomplete="off" placeholder="importe=…">
    </div>
    <div class="field"><div class="row-sub">El atajo de Apple Pay copia el pago al portapapeles al pagar.</div></div>`);
  const inp = $('#payPasteInput');
  inp.oninput = ()=>{ if (parsePaymentText(inp.value)){ closePickerSheet(); useText(inp.value); } };
  inp.focus();
}
function payAlreadyDone(key){ try{ return (JSON.parse(localStorage.getItem(PAY_DONE_KEY))||[]).includes(key); }catch(e){ return false; } }
function markPayDone(key){
  try{ const l = JSON.parse(localStorage.getItem(PAY_DONE_KEY))||[]; l.push(key); localStorage.setItem(PAY_DONE_KEY, JSON.stringify(l.slice(-50))); }catch(e){}
  try{ history.replaceState(null, '', location.pathname); }catch(e){} // que al recargar no vuelva a salir
}
// categoría y cuenta: primero lo último que apuntaste en ese comercio; si no, por palabras clave
function guessForMerchant(name, card){
  const n = normTxt(name);
  const prev = n ? state.transactions.find(t=>t.type==='expense' && t.note && normTxt(t.note)===n) : null;
  let categoryId = prev ? prev.categoryId : null, accountId = prev ? prev.accountId||null : null;
  if (!categoryId && n){
    const hay = ' '+n+' ';
    // las que acaban en espacio ('dia ', 'bar ') tienen que ser palabra entera
    const hit = PAY_KEYWORDS.find(([, words])=>words.some(w=>hay.includes(w.endsWith(' ') ? ' '+w : w)));
    const cat = hit && orderedCategories('expense').find(c=>normTxt(c.name)===normTxt(hit[0]));
    if (cat) categoryId = cat.id;
  }
  if (!accountId && card){
    const c = normTxt(card);
    const acc = orderedAccounts().find(a=>accountGroupOf(a)!=='activos' && (c.includes(normTxt(a.name)) || normTxt(a.name).includes(c)));
    if (acc) accountId = acc.id;
  }
  return {categoryId, accountId};
}
let _pendingPay = readPaymentParams();
function openPendingPayment(){
  const p = _pendingPay;
  if (!p || !state.ready || state.locked) return;
  _pendingPay = null;
  if (payAlreadyDone(p.key)) return;
  markPayDone(p.key);
  const note = cleanMerchant(p.merchant);
  const g = guessForMerchant(note, p.card);
  openAddSheet(null);
  addState.type = 'expense';
  addState.amount = p.amount.toFixed(2).replace('.',',');
  addState.note = note;
  if (g.categoryId) addState.categoryId = g.categoryId;
  if (g.accountId) addState.accountId = g.accountId;
  addState.fromPay = {raw: p.merchant && p.merchant!==note ? p.merchant : '', card: p.card};
  renderAddSheet(null);
}

/* ======================================================================
   PANTALLA DE BLOQUEO (PIN)
   ====================================================================== */
// bloqueo automático: si la app pasa en segundo plano más del tiempo elegido, vuelve a pedir el PIN
document.addEventListener('visibilitychange', ()=>{
  if (document.hidden){ state._hiddenAt = Date.now(); return; }
  const at = state._hiddenAt; state._hiddenAt = null;
  if (!at || !state.profile || !state.profile.pinEnabled || state.locked) return;
  if (Date.now() - at >= (state.profile.lockAfter ?? 60)*1000) showLock();
});
// tras el último dígito del PIN el dedo aún está en la pantalla: se espera a que lo levante (se descarta ese toque)
// y entonces se cierra, para que no abra lo que quede debajo. Si no llega el toque, se cierra igual a los 400 ms
function afterRelease(fn){
  let done = false;
  const go = ()=>{ if (done) return; done = true; document.removeEventListener('click', onClick, true); document.removeEventListener('touchend', onUp, true); document.removeEventListener('pointerup', onUp, true); fn(); };
  const onClick = e=>{ e.stopPropagation(); e.preventDefault(); setTimeout(go, 0); };
  const onUp = ()=>setTimeout(go, 60); // al levantar el dedo; si luego llega un click, se descarta antes
  document.addEventListener('click', onClick, true);
  document.addEventListener('touchend', onUp, true);
  document.addEventListener('pointerup', onUp, true);
  setTimeout(go, pinFingerDown ? 400 : 60); // si el dedo ya se levantó (p. ej. mientras se comprobaba el PIN), casi sin espera
}
let pinFingerDown = false;
['touchend','touchcancel','pointerup','pointercancel'].forEach(t=>document.addEventListener(t, ()=>{ pinFingerDown = false; }, true));
// tecla del PIN: cuenta en cuanto se toca (touchstart en móvil, pointerdown con ratón) y se marca al instante
function bindPinKey(b, fn){
  const hit = e=>{ e.preventDefault(); pinFingerDown = true; b.classList.add('pressed'); setTimeout(()=>b.classList.remove('pressed'), 120); fn(); };
  b.addEventListener('touchstart', hit, {passive:false});
  b.addEventListener('pointerdown', e=>{ if (e.pointerType!=='touch') hit(e); });
}
function showLock(){
  state.locked = true;
  $('#lock').classList.add('show');
  let entered = '';
  const renderDots = ()=>{
    $('#lockDots').innerHTML = [0,1,2,3].map(i=>`<div class="lock-dot ${i<entered.length?'filled':''}"></div>`).join('');
  };
  const keys = ['1','2','3','4','5','6','7','8','9','','0','⌫'];
  $('#lockPad').innerHTML = keys.map(k=> k==='' ? '<div></div>' : `<button class="lock-key" data-k="${k}">${k}</button>`).join('');
  $('#lockErr').textContent = '';
  $$('#lockPad [data-k]').forEach(b=>{
    // al tocar (pointerdown), no al soltar: así no se pierden toques rápidos seguidos
    bindPinKey(b, async ()=>{
      const k = b.dataset.k;
      if (k==='⌫'){ entered = entered.slice(0,-1); }
      else if (entered.length<4){ entered += k; }
      renderDots();
      if (entered.length===4){
        const hash = await sha256(entered);
        if (hash === state.profile.pinHash){
          afterRelease(()=>{ $('#lock').classList.remove('show'); state.locked = false; openPendingPayment(); });
        } else {
          $('#lockErr').textContent = 'PIN incorrecto, inténtalo de nuevo';
          entered = '';
          setTimeout(renderDots, 250);
        }
      }
    });
  });
  renderDots();
}

function enableSheetDrag(sheet, close){
  let y0=null, dy=0, dragging=false, sc=null;
  sheet.addEventListener('touchstart', e=>{ y0 = e.touches[0].clientY; dy = 0; dragging = false; sc = e.target.closest('.sheet-body'); }, {passive:true});
  sheet.addEventListener('touchmove', e=>{
    if (y0===null) return;
    const d = e.touches[0].clientY - y0;
    const canScroll = sc && sc.scrollHeight > sc.clientHeight + 1;
    if (!dragging){
      if (d>0 && (!canScroll || sc.scrollTop<=0)){ dragging = true; sheet.style.transition = 'none'; }
      else { if (!canScroll) e.preventDefault(); return; }
    }
    e.preventDefault();
    dy = Math.max(0, d);
    sheet.style.transform = `translateY(${dy}px)`;
  }, {passive:false});
  sheet.addEventListener('touchend', ()=>{
    if (dragging){ sheet.style.transition = ''; sheet.style.transform = ''; if (dy>90) close(); }
    y0 = null; dragging = false;
  });
}

(()=>{

    x0 = t.clientX; y0 = t.clientY; dx = 0; drag = false;
  }, {passive:true});
  page.addEventListener('touchmove', e=>{
    if (x0===null) return;
    const t = e.touches[0], mx = t.clientX - x0, my = t.clientY - y0;
    if (!drag){
      if (Math.abs(my) > 10 && Math.abs(my) > Math.abs(mx)){ x0 = null; return; } // es scroll vertical
      if (mx > 12 && mx > Math.abs(my)*1.5) drag = true; else return;
    }
    dx = Math.max(0, mx);
    page.style.transition = 'none'; page.style.transform = `translateX(${dx}px)`;
    e.preventDefault();
  }, {passive:false});
  page.addEventListener('touchend', ()=>{
    if (x0===null) return; x0 = null;
    if (!drag) return;
    page.style.transition = 'transform .2s ease-out';
    if (dx > page.offsetWidth*0.3){
      page.style.transform = 'translateX(100%)';
      setTimeout(()=>{ page.style.transition = 'none'; page.style.transform = ''; const b = $('#modalBackBtn'); if (b) b.click(); }, 200);
    } else page.style.transform = '';
  });
})();

try{ applyTheme(localStorage.getItem('balance_theme')); }catch(e){}
try{ applyStyle(localStorage.getItem('balance_style')); }catch(e){ applyStyle('glass'); }
init();
